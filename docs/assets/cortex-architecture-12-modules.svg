<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">CORTEX complete technical architecture, modules 01 to 12</title><desc id="d">Layered architecture: iOS app, Go API with twelve product modules and shared platform, PostgreSQL with pgvector, object storage, Go worker, Python AI service, external sources, and CI. Shipped modules are solid, partial are amber, planned are dashed.</desc>
