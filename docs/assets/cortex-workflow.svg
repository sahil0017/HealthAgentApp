<title id="t">CORTEX technical workflow</title>
<desc id="d">Animated diagram. Lane 1: a report is uploaded from the iOS app through the Go API to the worker and AI service, then a person reviews and approves values. Lane 2: a question passes consent checks, retrieval, emergency triage and safety checks, and returns a cited answer with confidence that is saved to history.</desc>
