<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" fill="none">
  <defs>
    <linearGradient id="background" x1="30" y1="0" x2="1090" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111C1A"/>
      <stop offset="1" stop-color="#080D0C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(460 360 -240 307 294 175)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21463A" stop-opacity=".58"/>
      <stop offset="1" stop-color="#102019" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#background)"/>
  <rect width="1200" height="700" rx="28" fill="url(#glow)"/>
  <path d="M40 1h1120" stroke="#304039" stroke-opacity=".7"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="76" y="72" width="34" height="34" rx="10" fill="#1D3A2F"/>
    <path d="M93 79v20M83 89h20" stroke="#7AE0B6" stroke-width="2.5" stroke-linecap="round"/>
    <text x="124" y="96" fill="#E8F0EC" font-size="17" font-weight="700" letter-spacing="3">CORTEX</text>

    <text x="76" y="184" fill="#7AE0B6" font-size="13" font-weight="700" letter-spacing="2.2">YOUR HEALTH RECORDS, IN ONE PLACE</text>
    <text x="76" y="248" fill="#F4F7F5" font-size="47" font-weight="700">A clearer view of</text>
    <text x="76" y="305" fill="#F4F7F5" font-size="47" font-weight="700">your health records.</text>
    <text x="76" y="353" fill="#AAB8B1" font-size="18">Organize reports, review extracted values, and explore</text>
    <text x="76" y="382" fill="#AAB8B1" font-size="18">approved records with a privacy-minded AI workflow.</text>

    <rect x="76" y="424" width="159" height="38" rx="19" fill="#192822" stroke="#354A3F"/>
    <circle cx="97" cy="443" r="4" fill="#7AE0B6"/>
    <circle cx="97" cy="443" r="4" fill="#7AE0B6" fill-opacity=".5">
      <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values=".5;0;.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="111" y="448" fill="#DAE5DF" font-size="13" font-weight="600">Human reviewed</text>

    <rect x="247" y="424" width="150" height="38" rx="19" fill="#192822" stroke="#354A3F"/>
    <text x="268" y="448" fill="#DAE5DF" font-size="13" font-weight="600">Profile scoped</text>

    <rect x="76" y="478" width="360" height="1" fill="#304039"/>
    <text x="76" y="518" fill="#81928A" font-size="12" font-weight="700" letter-spacing="1.7">BUILT WITH</text>
    <text x="76" y="550" fill="#D1DAD5" font-size="15">SwiftUI  /  Go  /  Python  /  PostgreSQL</text>
    <text x="76" y="624" fill="#72827B" font-size="12">Local-development prototype · not a medical device</text>
  </g>

  <svg x="824" y="0" width="344" height="700" viewBox="0 0 600 1220">
    <defs>
      <linearGradient id="frame" x1="70" y1="0" x2="526" y2="1220" gradientUnits="userSpaceOnUse">
        <stop stop-color="#232B2A"/>
        <stop offset="1" stop-color="#101615"/>
      </linearGradient>
      <linearGradient id="screen" x1="90" y1="40" x2="510" y2="1160" gradientUnits="userSpaceOnUse">
        <stop stop-color="#111918"/>
        <stop offset="1" stop-color="#0B1110"/>
      </linearGradient>
      <filter id="shadow" x="20" y="0" width="560" height="1220" filterUnits="userSpaceOnUse">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
    </defs>
    <rect x="50" y="30" width="500" height="1150" rx="72" fill="#000" fill-opacity=".72" filter="url(#shadow)"/>
    <rect x="48" y="20" width="504" height="1160" rx="72" fill="url(#frame)" stroke="#4A5551" stroke-width="2"/>
    <rect x="68" y="40" width="464" height="1120" rx="54" fill="url(#screen)"/>
    <rect x="203" y="54" width="194" height="34" rx="17" fill="#050807"/>

    <text x="100" y="133" fill="#F2F5F3" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="3">CORTEX</text>
    <circle cx="488" cy="124" r="20" fill="#1D2D28"/>
    <path d="M488 114v20M478 124h20" stroke="#7AE0B6" stroke-width="2.5" stroke-linecap="round"/>

    <text x="100" y="193" fill="#8C9C95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">YOUR HEALTH RECORDS</text>
    <text x="100" y="233" fill="#F3F6F4" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Health overview</text>
    <text x="100" y="260" fill="#899992" font-family="Arial, Helvetica, sans-serif" font-size="14">Your information, organized in one place.</text>

    <rect x="92" y="284" width="416" height="148" rx="18" fill="#17211E" stroke="#26332E"/>
    <text x="116" y="319" fill="#92A39B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PRIVACY CONTROLS</text>
    <text x="116" y="355" fill="#E8EFEB" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Report storage</text>
    <rect x="426" y="336" width="54" height="28" rx="14" fill="#318767"/>
    <circle cx="464" cy="350" r="10" fill="#F5FBF8"/>
    <text x="116" y="399" fill="#E8EFEB" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Document processing</text>
    <rect x="426" y="380" width="54" height="28" rx="14" fill="#318767"/>
    <circle cx="464" cy="394" r="10" fill="#F5FBF8"/>

    <text x="100" y="487" fill="#9AA9A2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">REPORTS</text>
    <text x="489" y="487" fill="#7B8C84" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end">1 report</text>
    <rect x="92" y="505" width="416" height="104" rx="16" fill="#151E1B" stroke="#293630"/>
    <rect x="112" y="526" width="48" height="60" rx="11" fill="#20332B"/>
    <path d="M126 543h20M126 551h20M126 559h14" stroke="#7AE0B6" stroke-width="2.5" stroke-linecap="round"/>
    <text x="177" y="545" fill="#EDF2EF" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Sample report.pdf</text>
    <text x="177" y="571" fill="#9AA9A2" font-family="Arial, Helvetica, sans-serif" font-size="13">Ready for your review</text>
    <circle cx="474" cy="556" r="13" fill="#1E382D"/>
    <path d="m469 556 4 4 7-8" stroke="#7AE0B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="100" y="669" fill="#9AA9A2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">APPROVED HEALTH VALUES</text>
    <rect x="92" y="687" width="416" height="84" rx="16" fill="#151E1B" stroke="#293630"/>
    <circle cx="125" cy="729" r="17" fill="#20332B"/>
    <path d="M125 720v18M116 729h18" stroke="#7AE0B6" stroke-width="2.2" stroke-linecap="round"/>
    <text x="157" y="723" fill="#E8EFEB" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Reviewed results live here</text>
    <text x="157" y="746" fill="#8C9C95" font-family="Arial, Helvetica, sans-serif" font-size="12">Values are saved after your approval</text>

    <text x="100" y="831" fill="#9AA9A2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">ASK ABOUT YOUR RECORDS</text>
    <rect x="92" y="849" width="416" height="132" rx="16" fill="#151E1B" stroke="#293630"/>
    <text x="116" y="889" fill="#87978F" font-family="Arial, Helvetica, sans-serif" font-size="14">Summarize my recent lab results</text>
    <path d="M116 908h368" stroke="#293630"/>
    <rect x="116" y="925" width="160" height="38" rx="9" fill="#318767"/>
    <text x="137" y="949" fill="#F7FCF9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Ask CORTEX</text>
    <path d="M247 944h12m-5-5 5 5-5 5" stroke="#F7FCF9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="92" y="1005" width="416" height="84" rx="16" fill="#121A17" stroke="#26332E"/>
    <circle cx="125" cy="1047" r="17" fill="#1C3027"/>
    <path d="m125 1037 8 4v7c0 6-4 9-8 12-4-3-8-6-8-12v-7l8-4Z" stroke="#7AE0B6" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="157" y="1041" fill="#DCE5E0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Private by design</text>
    <text x="157" y="1062" fill="#8C9C95" font-family="Arial, Helvetica, sans-serif" font-size="12">Profile-scoped · human reviewed</text>

    <rect x="238" y="1124" width="124" height="6" rx="3" fill="#79847F"/>
  </svg>
</svg>
