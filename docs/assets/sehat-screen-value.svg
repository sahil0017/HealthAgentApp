<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<title>How each Sehat screen adds value to a user's day</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a2e"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1000" height="640" fill="url(#bg)"/>
<text x="500" y="36" text-anchor="middle" fill="#e6edf7" font-size="20" font-weight="700">One day with Sehat: what each screen does for your life</text>
<text x="500" y="56" text-anchor="middle" fill="#7f8ea8" font-size="11.5">The highlight moves through the day. Information support, not medical advice.</text>
<g transform="translate(30,84)">
<rect width="215" height="245" rx="14" fill="#12203a" stroke="#23365a"/>
<rect width="215" height="245" rx="14" fill="none" stroke="#5eead4" stroke-width="2.5" filter="url(#glow)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.11;0.125;1" dur="16s" begin="0s" repeatCount="indefinite"/></rect>
<circle cx="26" cy="30" r="14" fill="#5eead4" opacity="0.18"/><text x="26" y="35" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="700">1</text>
<text x="48" y="27" fill="#5eead4" font-size="14" font-weight="700">Today</text>
<text x="48" y="43" fill="#7f8ea8" font-size="10.5">Morning glance</text>
<text x="16" y="82" fill="#7f8ea8" font-size="9.5" letter-spacing="1">YOU DO</text>
<text x="16" y="98" fill="#cfd9ea" font-size="11.5">Rings, what needs attention,</text>
<text x="16" y="114" fill="#cfd9ea" font-size="11.5">one daily briefing</text>
<text x="16" y="152" fill="#5eead4" font-size="9.5" letter-spacing="1">YOUR LIFE GETS</text>
<text x="16" y="168" fill="#e6edf7" font-size="11.5">Starts the day knowing what</text>
<text x="16" y="184" fill="#e6edf7" font-size="11.5">matters. No digging through</text>
<text x="16" y="200" fill="#e6edf7" font-size="11.5">files.</text>
</g>
<g transform="translate(265,84)">
<rect width="215" height="245" rx="14" fill="#12203a" stroke="#23365a"/>
<rect width="215" height="245" rx="14" fill="none" stroke="#60a5fa" stroke-width="2.5" filter="url(#glow)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.11;0.125;1" dur="16s" begin="2s" repeatCount="indefinite"/></rect>
<circle cx="26" cy="30" r="14" fill="#60a5fa" opacity="0.18"/><text x="26" y="35" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="700">2</text>
<text x="48" y="27" fill="#60a5fa" font-size="14" font-weight="700">Vault + Scan</text>
<text x="48" y="43" fill="#7f8ea8" font-size="10.5">Keep every report</text>
<text x="16" y="82" fill="#7f8ea8" font-size="9.5" letter-spacing="1">YOU DO</text>
<text x="16" y="98" fill="#cfd9ea" font-size="11.5">Photo a report, review values,</text>
<text x="16" y="114" fill="#cfd9ea" font-size="11.5">approve</text>
<text x="16" y="152" fill="#60a5fa" font-size="9.5" letter-spacing="1">YOUR LIFE GETS</text>
<text x="16" y="168" fill="#e6edf7" font-size="11.5">Reports stop getting lost.</text>
<text x="16" y="184" fill="#e6edf7" font-size="11.5">Everything is in one safe</text>
<text x="16" y="200" fill="#e6edf7" font-size="11.5">place.</text>
</g>
<g transform="translate(500,84)">
<rect width="215" height="245" rx="14" fill="#12203a" stroke="#23365a"/>
<rect width="215" height="245" rx="14" fill="none" stroke="#34d399" stroke-width="2.5" filter="url(#glow)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.11;0.125;1" dur="16s" begin="4s" repeatCount="indefinite"/></rect>
<circle cx="26" cy="30" r="14" fill="#34d399" opacity="0.18"/><text x="26" y="35" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">3</text>
<text x="48" y="27" fill="#34d399" font-size="14" font-weight="700">Health</text>
<text x="48" y="43" fill="#7f8ea8" font-size="10.5">Understand results</text>
<text x="16" y="82" fill="#7f8ea8" font-size="9.5" letter-spacing="1">YOU DO</text>
<text x="16" y="98" fill="#cfd9ea" font-size="11.5">Labs, trends, vitals and</text>
<text x="16" y="114" fill="#cfd9ea" font-size="11.5">devices</text>
<text x="16" y="152" fill="#34d399" font-size="9.5" letter-spacing="1">YOUR LIFE GETS</text>
<text x="16" y="168" fill="#e6edf7" font-size="11.5">Sees what changed and whether</text>
<text x="16" y="184" fill="#e6edf7" font-size="11.5">a result is in range.</text>
</g>
<g transform="translate(735,84)">
<rect width="215" height="245" rx="14" fill="#12203a" stroke="#23365a"/>
<rect width="215" height="245" rx="14" fill="none" stroke="#a78bfa" stroke-width="2.5" filter="url(#glow)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.11;0.125;1" dur="16s" begin="6s" repeatCount="indefinite"/></rect>
<circle cx="26" cy="30" r="14" fill="#a78bfa" opacity="0.18"/><text x="26" y="35" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700">4</text>
<text x="48" y="27" fill="#a78bfa" font-size="14" font-weight="700">Agent</text>
<text x="48" y="43" fill="#7f8ea8" font-size="10.5">Ask and get help</text>
<text x="16" y="82" fill="#7f8ea8" font-size="9.5" letter-spacing="1">YOU DO</text>
<text x="16" y="98" fill="#cfd9ea" font-size="11.5">Cited answers, plans, approval</text>
<text x="16" y="114" fill="#cfd9ea" font-size="11.5">queue</text>
<text x="16" y="152" fill="#a78bfa" font-size="9.5" letter-spacing="1">YOUR LIFE GETS</text>
<text x="16" y="168" fill="#e6edf7" font-size="11.5">Gets answers from own records.</text>
<text x="16" y="184" fill="#e6edf7" font-size="11.5">Nothing happens without</text>
<text x="16" y="200" fill="#e6edf7" font-size="11.5">approval.</text>
</g>
<g transform="translate(30,354)">
<rect width="215" height="245" rx="14" fill="#12203a" stroke="#23365a"/>
<rect width="215" height="245" rx="14" fill="none" stroke="#fbbf24" stroke-width="2.5" filter="url(#glow)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.11;0.125;1" dur="16s" begin="8s" repeatCount="indefinite"/></rect>
<circle cx="26" cy="30" r="14" fill="#fbbf24" opacity="0.18"/><text x="26" y="35" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">5</text>
<text x="48" y="27" fill="#fbbf24" font-size="14" font-weight="700">Lifestyle</text>
<text x="48" y="43" fill="#7f8ea8" font-size="10.5">Spot patterns</text>
<text x="16" y="82" fill="#7f8ea8" font-size="9.5" letter-spacing="1">YOU DO</text>
<text x="16" y="98" fill="#cfd9ea" font-size="11.5">Sleep, mood, symptoms,</text>
<text x="16" y="114" fill="#cfd9ea" font-size="11.5">correlations</text>
<text x="16" y="152" fill="#fbbf24" font-size="9.5" letter-spacing="1">YOUR LIFE GETS</text>
<text x="16" y="168" fill="#e6edf7" font-size="11.5">Notices what may affect</text>
<text x="16" y="184" fill="#e6edf7" font-size="11.5">symptoms. Correlation, not</text>
<text x="16" y="200" fill="#e6edf7" font-size="11.5">cause.</text>
</g>
<g transform="translate(265,354)">
<rect width="215" height="245" rx="14" fill="#12203a" stroke="#23365a"/>
<rect width="215" height="245" rx="14" fill="none" stroke="#f472b6" stroke-width="2.5" filter="url(#glow)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.11;0.125;1" dur="16s" begin="10s" repeatCount="indefinite"/></rect>
<circle cx="26" cy="30" r="14" fill="#f472b6" opacity="0.18"/><text x="26" y="35" text-anchor="middle" fill="#f472b6" font-size="14" font-weight="700">6</text>
<text x="48" y="27" fill="#f472b6" font-size="14" font-weight="700">Visit prep</text>
<text x="48" y="43" fill="#7f8ea8" font-size="10.5">Before the doctor</text>
<text x="16" y="82" fill="#7f8ea8" font-size="9.5" letter-spacing="1">YOU DO</text>
<text x="16" y="98" fill="#cfd9ea" font-size="11.5">One-page brief and questions</text>
<text x="16" y="114" fill="#cfd9ea" font-size="11.5">to ask</text>
<text x="16" y="152" fill="#f472b6" font-size="9.5" letter-spacing="1">YOUR LIFE GETS</text>
<text x="16" y="168" fill="#e6edf7" font-size="11.5">Shorter, better appointments.</text>
<text x="16" y="184" fill="#e6edf7" font-size="11.5">Nothing forgotten.</text>
</g>
