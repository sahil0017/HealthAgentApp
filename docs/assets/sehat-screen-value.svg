<rect width="215" height="245" rx="14" fill="#12203a" stroke="#23365a"/>
<rect width="215" height="245" rx="14" fill="none" stroke="#fb923c" stroke-width="2.5" filter="url(#glow)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.11;0.125;1" dur="16s" begin="12s" repeatCount="indefinite"/></rect>
<circle cx="26" cy="30" r="14" fill="#fb923c" opacity="0.18"/><text x="26" y="35" text-anchor="middle" fill="#fb923c" font-size="14" font-weight="700">7</text>
<text x="48" y="27" fill="#fb923c" font-size="14" font-weight="700">Nearby</text>
<text x="48" y="43" fill="#7f8ea8" font-size="10.5">Care around me</text>
<text x="16" y="82" fill="#7f8ea8" font-size="9.5" letter-spacing="1">YOU DO</text>
<text x="16" y="98" fill="#cfd9ea" font-size="11.5">Alerts, hospitals, doctors by</text>
<text x="16" y="114" fill="#cfd9ea" font-size="11.5">area</text>
<text x="16" y="152" fill="#fb923c" font-size="9.5" letter-spacing="1">YOUR LIFE GETS</text>
<text x="16" y="168" fill="#e6edf7" font-size="11.5">Finds care fast. Only a coarse</text>
<text x="16" y="184" fill="#e6edf7" font-size="11.5">area leaves the phone.</text>
</g>
<g transform="translate(735,354)">
<rect width="215" height="245" rx="14" fill="#12203a" stroke="#23365a"/>
<rect width="215" height="245" rx="14" fill="none" stroke="#94a3b8" stroke-width="2.5" filter="url(#glow)" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.11;0.125;1" dur="16s" begin="14s" repeatCount="indefinite"/></rect>
<circle cx="26" cy="30" r="14" fill="#94a3b8" opacity="0.18"/><text x="26" y="35" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="700">8</text>
<text x="48" y="27" fill="#94a3b8" font-size="14" font-weight="700">Family + Privacy</text>
<text x="48" y="43" fill="#7f8ea8" font-size="10.5">Stay in control</text>
<text x="16" y="82" fill="#7f8ea8" font-size="9.5" letter-spacing="1">YOU DO</text>
<text x="16" y="98" fill="#cfd9ea" font-size="11.5">Share, revoke, export, delete</text>
<text x="16" y="152" fill="#94a3b8" font-size="9.5" letter-spacing="1">YOUR LIFE GETS</text>
