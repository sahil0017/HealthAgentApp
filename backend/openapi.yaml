openapi: 3.1.0
info:
  title: CORTEX Core API
  version: 1.0.0
  description: Swift-facing profile, consent, document review, and observation API.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
paths:
  /auth/session:
    post:
      security: []
      summary: Exchange a verified Google or Apple ID token for a session
      description: >
        The ID token's signature, issuer, audience, expiry and nonce are verified. Native clients use the returned
        bearer token; browsers also receive an HttpOnly `cortex_session` cookie and must send `X-Cortex-Client` on writes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, id_token, nonce]
              properties:
                provider: { type: string, enum: [google, apple, oidc] }
                id_token: { type: string }
                nonce: { type: string }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/config:
    get:
      security: []
      summary: Sign-in providers and their public client IDs
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/logout:
    post:
      summary: Revoke current session
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /users/me:
    get:
      summary: Get authenticated user
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles:
    get:
      summary: List profiles
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Create profile
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}:
    parameters: [{ $ref: '#/components/parameters/profileID' }]
    get:
      summary: Get profile
      responses:
        '200': { $ref: '#/components/responses/Success' }
    patch:
      summary: Update profile name, timezone, measurement system, date of birth, sex, blood group or height
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      summary: Permanently delete the profile, its stored files, observations and embeddings
      description: 'Requires the body {"confirm":"DELETE"}. Files are removed first; if storage fails nothing else is deleted and the call can be repeated. Audit events are kept as metadata only.'
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '204': { description: Deleted }
        '400': { description: Confirmation missing }
        '404': { description: Profile not found }
        '502': { description: Some files could not be removed; retry }
  /profiles/{profileID}/access-history:
    parameters: [{ $ref: '#/components/parameters/profileID' }]
    get:
      summary: List access and activity events for the profile, newest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/export:
    parameters: [{ $ref: '#/components/parameters/profileID' }]
    get:
      summary: Download all data held for the profile as JSON
      description: 'Includes profile, consents, document metadata, observations with revisions and audit events. File bytes are not inlined; internal object keys are omitted. The export itself is audited.'
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/overview:
    parameters: [{ $ref: '#/components/parameters/profileID' }]
    get:
      summary: Command-centre overview
      description: 'Profile summary, attention items, recent changes, goals with progress, next follow-up, reminders due within 7 days, suggested follow-ups, and a data-completeness score. Uses verified values only and never compares across units.'
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/timeline:
    parameters: [{ $ref: '#/components/parameters/profileID' }]
    get:
      summary: Unified timeline of documents, observations, history and follow-ups, newest first
      parameters:
        - { name: kind, in: query, schema: { type: string }, description: 'Comma-separated kinds' }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid kind, paging or date range }
  /profiles/{profileID}/history:
    parameters: [{ $ref: '#/components/parameters/profileID' }]
    get:
      summary: List medical history entries
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Add a medical history entry (needs storage consent)
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { description: Storage consent missing }
  /history/{entryID}:
    parameters: [{ name: entryID, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      summary: Update a history entry
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { description: Not found }
    delete:
      summary: Delete a history entry
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }
  /profiles/{profileID}/goals:
    parameters: [{ $ref: '#/components/parameters/profileID' }]
    get:
      summary: List goals with progress
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Add a goal (needs storage consent)
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { description: Storage consent missing }
  /goals/{goalID}:
    parameters: [{ name: goalID, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      summary: Update a goal
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { description: Not found }
    delete:
      summary: Delete a goal
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }
  /profiles/{profileID}/follow-ups:
    parameters: [{ $ref: '#/components/parameters/profileID' }]
    get:
      summary: List follow-ups
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Add a follow-up (needs storage consent)
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { description: Storage consent missing }
  /follow-ups/{followUpID}:
    parameters: [{ name: followUpID, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      summary: Update a follow-up
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { description: Not found }
    delete:
      summary: Delete a follow-up
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }
  /profiles/{profileID}/consents:
    parameters: [{ $ref: '#/components/parameters/profileID' }]
    get:
      summary: List consent records
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Record consent for a purpose and policy version
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/consents/{purpose}:
    parameters:
      - { $ref: '#/components/parameters/profileID' }
      - name: purpose
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Grant or withdraw consent for a purpose
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /consents/{consentID}:
    parameters:
      - name: consentID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a consent record
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      summary: Withdraw consent while preserving its history
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/documents:
    parameters: [{ $ref: '#/components/parameters/profileID' }]
    get:
      summary: List documents
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/documents/upload-intents:
    post:
      summary: Create a short-lived signed upload intent
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /profiles/{profileID}/documents/search:
    parameters: [{ $ref: '#/components/parameters/profileID' }]
    get:
      summary: Search extracted text across all documents, returning document and page for each hit
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { name: document_type, in: query, schema: { type: string } }
        - { name: mode, in: query, description: "auto uses meaning plus keywords when AI processing is consented and the AI service is ready, otherwise keywords only", schema: { type: string, enum: [auto, keyword], default: auto } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/documents/{documentID}:
    get:
      summary: Read document status and review candidates
      parameters:
        - { $ref: '#/components/parameters/profileID' }
        - name: documentID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /documents/{documentID}/history:
    get:
      summary: Processing, type-suggestion, owner-edit (with previous values) and approval events for a document
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /documents/{documentID}/complete:
    post:
      summary: Verify uploaded object and mark it ready for manual review
      parameters: [{ $ref: '#/components/parameters/documentID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/Error' }
  /documents/{documentID}:
    parameters: [{ $ref: '#/components/parameters/documentID' }]
    get:
      summary: Get document metadata
      responses:
        '200': { $ref: '#/components/responses/Success' }
    patch:
      summary: Update document filename or category
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      summary: Delete document and derived observations
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /documents/{documentID}/download:
    get:
      summary: Create short-lived signed download URL
      parameters: [{ $ref: '#/components/parameters/documentID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/documents/{documentID}/approve:
    post:
      summary: Save manually reviewed biomarkers
      parameters:
        - { $ref: '#/components/parameters/profileID' }
        - name: documentID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/observations:
    parameters: [{ $ref: '#/components/parameters/profileID' }]
    get:
      summary: List verified observations
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Create a manually entered observation
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/biomarkers:
    get:
      summary: List biomarker catalog entries
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/biomarkers/summary:
    parameters: [{ $ref: '#/components/parameters/profileID' }]
    get:
      summary: Latest value, change, trend, range flag and measurement cadence for every biomarker
      description: 'Verified values only. Readings in a unit with no approved conversion are counted as excluded, never guessed.'
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/biomarkers/compare:
    parameters: [{ $ref: '#/components/parameters/profileID' }]
    get:
      summary: Every biomarker at two dates, in one unit, with the change between them
      description: 'Query from (required) and to (default today), both YYYY-MM-DD. Uses the latest verified reading on or before each date. Status is one of changed, unchanged, returned_to_range, left_range, new, no_recent_data, same_reading.'
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /profiles/{profileID}/biomarkers/coverage:
    parameters: [{ $ref: '#/components/parameters/profileID' }]
    get:
      summary: Which panels (CBC, glucose, lipid, liver, kidney, vitamins, hormones) are current, stale or never measured
      description: 'Verified readings only. Each biomarker belongs to the category assigned when it was reviewed into the catalog.'
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/biomarkers/{code}/trend:
    parameters:
      - { $ref: '#/components/parameters/profileID' }
      - { name: code, in: path, required: true, schema: { type: string } }
    get:
      summary: Comparable series for one biomarker in a single unit
      description: 'Each point carries its original value and unit, whether it was converted, lab or device origin, verification status, and the range used (printed on the report, or an approved reference chosen by the profile sex and age). Trends use verified points only.'
      parameters:
        - { name: include_unverified, in: query, schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { description: Profile or biomarker not found }
  /profiles/{profileID}/biomarkers/{code}/history:
    get:
      summary: Read a biomarker history
      parameters:
        - { $ref: '#/components/parameters/profileID' }
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /observations/{observationID}/verify:
    post:
      summary: Verify an observation
      parameters:
        - name: observationID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { description: Health data consent required }
        '404': { description: Observation not found }
        '500': { description: Observation access check failed }
  /observations/{observationID}/corrections:
    post:
      summary: Record a corrected observation revision
      parameters:
        - name: observationID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid correction }
        '403': { description: Health data consent required }
        '404': { description: Observation not found }
        '500': { description: Observation access check or correction failed }
  /profiles/{profileID}/questions:
    post:
      summary: Ask a question; the answer is saved to the profile's history
      description: Requires `ai_processing` plus `medical_record_storage` or `health_data` consent. Retrieves the profile's most relevant verified records from pgvector, then asks the AI service. Approved research is cited as `[R#]` with its PubMed identifier. Questions are limited to 4000 characters. Emergency and self-harm wording is answered with urgent guidance only and flagged `urgent`. The `data` object holds `id`, `question`, `answer`, `sources`, `limitations`, `workflow`, `urgent`, `triage` (none, emergency, crisis), `confidence` (high, limited, insufficient, not_applicable), `uncertainty`, `suggested_questions` and `created_at`. A failed AI call returns 502 and saves nothing.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Blank or over-long question }
        '403': { description: Consent required }
        '502': { description: AI service unavailable }
    get:
      summary: List saved questions and answers, newest first
      description: Query `limit` (1-100, default 25) and `offset`. `data.questions` holds the saved answers, including any `feedback`.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/questions/{questionID}:
    get:
      summary: Read one saved question and answer
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: questionID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { description: Not found or not owned }
    delete:
      summary: Delete one saved question (audited; the audit row never holds the question text)
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: questionID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Deleted }
        '404': { description: Not found or not owned }
  /profiles/{profileID}/questions/{questionID}/feedback:
    put:
      summary: Rate an answer
      description: Body `{"rating":"helpful"|"not_helpful","comment":"optional, up to 1000 characters"}`. A later rating replaces the earlier one and its comment.
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: questionID, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid rating or comment }
        '404': { description: Not found or not owned }
  /profiles/{profileID}/mcp-tokens:
    post:
      summary: Mint a 10-minute MCP token scoped to this owner and profile (records:read)
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /mcp:
    post:
      summary: MCP JSON-RPC endpoint (initialize, tools/list, tools/call)
      description: Authenticated only by a scoped MCP token, never by a user session. Tools search_records, list_observations and biomarker_history are read-only, always bound to the token's profile, require active AI-processing and health-data consent, and are audited.
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { description: JSON-RPC 2.0 response }
  /device-metrics:
    get:
      summary: List the device metrics that can be synced
      description: Each metric has its canonical `unit`, `accepted_units` (others are converted on sync), whether it is `cumulative` (steps, active energy, sleep are summed per day) and an optional `lab_biomarker_code` for lab comparison.
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/devices:
    get:
      summary: List connected devices with reading counts and last sync
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Connect a device (idempotent on `source` + `external_id`)
      description: Requires `health_data_integration` consent. Body `{kind, source, name, manufacturer?, model?, external_id?}`. `kind` is phone_health_app, smartwatch, fitness_band, blood_pressure_monitor, glucometer, cgm, scale, pulse_oximeter, thermometer or other; `source` is healthkit, bluetooth, import or manual. Reconnecting the same external id returns the existing device with 200. At most 50 devices per profile.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { description: Existing device reconnected }
        '201': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid device }
        '403': { description: Integration consent required }
        '409': { description: Device limit reached }
  /profiles/{profileID}/devices/{deviceID}:
    patch:
      summary: Rename, disconnect or reconnect a device
      description: "Body `{name?, status?: connected|disconnected}`. Disconnecting keeps history and blocks further syncs; reconnecting needs integration consent."
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: deviceID, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid change }
        '404': { description: Not found or not owned }
    delete:
      summary: Remove a device and erase every reading and sync record it produced (audited with counts only)
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: deviceID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { description: Not found or not owned }
  /profiles/{profileID}/devices/{deviceID}/readings:
    post:
      summary: Sync a batch of readings (idempotent)
      description: "Requires `health_data_integration` consent and a connected device. Body `{readings: [{metric, value, unit, measured_at (RFC 3339), external_id?, utc_offset_minutes?}]}`, 1-500 per call. Values are converted to the canonical unit and checked for plausibility. A reading seen before (same `external_id`, or same metric, time, value and unit) is counted in `duplicates`; invalid ones are listed by index in `errors` and do not block the rest. `utc_offset_minutes` decides the local calendar day used for daily summaries. Returns `accepted`, `duplicates`, `rejected`, `errors`."
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: deviceID, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Empty or oversized batch }
        '403': { description: Integration consent required }
        '404': { description: Not found or not owned }
        '409': { description: Device is disconnected }
  /profiles/{profileID}/devices/{deviceID}/syncs:
    get:
      summary: Sync history of a device, newest first
      description: Query `limit` and `offset`. Each entry has accepted, duplicates, rejected counts and the measurement time span.
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: deviceID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { description: Not found or not owned }
  /profiles/{profileID}/device-readings:
    get:
      summary: List raw device readings, newest first
      description: Query `metric`, `device_id`, `from` and `to` (YYYY-MM-DD local dates), `limit`, `offset`. Every item has `measurement_kind` of `device`, never `lab`.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid filter }
  /profiles/{profileID}/device-readings/summary:
    get:
      summary: Descriptive summary per metric
      description: Latest value, 7 and 30 day averages, and the change against the previous 30 days (`rising`, `falling`, `stable`, `insufficient_data`; at least 3 days in each window and a 5% change). Cumulative metrics average daily totals. Typical adult ranges are informational only and never a diagnosis.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/device-readings/{metric}/daily:
    get:
      summary: Daily aggregates (mean, min, max, sum, count) for one metric
      description: Query `days` (1-365, default 30).
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: metric, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Unknown metric or range }
  /profiles/{profileID}/device-readings/{metric}/lab-comparison:
    get:
      summary: Verified laboratory results beside device readings taken near them
      description: Only for metrics with a `lab_biomarker_code` (blood_glucose). Query `window_days` (0-14, default 3). Lab results are converted only through known units, others are listed in `excluded`. The response states that the two are not interchangeable and the laboratory result is the reference.
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: metric, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Unknown metric, or no laboratory equivalent }
  /profiles/{profileID}/investigations:
    get:
      summary: List saved research investigations
      description: Query `status` (open, archived). `data.investigations` holds each investigation with `source_count` and `note_count`.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid status filter }
    post:
      summary: Save a research investigation (a question to follow over time)
      description: Body `question` (2-500 characters) and optional `title`. At most 100 per profile.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid question }
        '409': { description: Investigation limit reached }
  /profiles/{profileID}/investigations/{investigationID}:
    parameters: [{ $ref: '#/components/parameters/profileID' }, { name: investigationID, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: An investigation with its approved sources (identifier, title, URL, excerpt) and notes
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Rename, change the question, or archive/reopen (`status`)
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid change }
    delete:
      summary: Delete an investigation and its items
      responses:
        '204': { description: Deleted }
  /profiles/{profileID}/investigations/{investigationID}/items:
    post:
      summary: Attach an approved research source (`source_id`) or a personal note (`note`)
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: investigationID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { description: Send exactly one of source_id or note }
        '404': { description: Source is not approved or does not exist }
        '409': { description: Source already attached, or the investigation is full }
  /profiles/{profileID}/investigations/{investigationID}/items/{itemID}:
    delete:
      summary: Remove a source or note
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: investigationID, in: path, required: true, schema: { type: string, format: uuid } }, { name: itemID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Removed }
  /profiles/{profileID}/investigations/{investigationID}/refresh:
    post:
      summary: Attach newly matching approved sources
      description: Searches only human-approved research for the question. Never the open web and never the profile's own records. `data.added` is the number of new sources.
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: investigationID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/retention:
    get:
      summary: Retention policy (null means keep indefinitely)
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      summary: Set how long AI answer history and device readings are kept
      description: Body `ai_history_days` and `device_readings_days` (1-3650 or null). Replaces the policy. The worker applies it hourly; audit events are never purged.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid number of days }
  /profiles/{profileID}/retention/apply:
    post:
      summary: Apply the retention policy now; returns counts removed
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/shares:
    get:
      summary: Family shares for a profile (status pending, active, expired, revoked)
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      summary: Create a read-only share and a one-time invite code
      description: Body `label`, `scopes` (summary, labs, history, follow_ups) and `expires_in_days` (1-365, default 30). The code is returned once and stored only as a hash. At most 10 active shares.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid share }
        '409': { description: Share limit reached }
  /profiles/{profileID}/shares/{shareID}:
    delete:
      summary: Revoke a share
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: shareID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Revoked }
  /shares/accept:
    post:
      summary: Redeem an invite code
      description: Body `code`. Single use; fails if used, revoked or expired, or if it is the caller's own profile.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Missing code or own profile }
        '404': { description: Invalid, used, revoked or expired code }
  /shared-with-me:
    get:
      summary: Profiles shared with the caller
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /shared-with-me/{shareID}:
    parameters: [{ name: shareID, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Read-only view limited to the share's scopes
      description: Labs are the latest verified value per biomarker. Each view appears in the owner's access history.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Leave a share
      responses:
        '204': { description: Left }
  /knowledge/entries:
    get:
      summary: List learned knowledge proposals (administrators only)
      description: Query `status` (pending, approved, rejected), `kind` (biomarker, unit, research_source) and `limit`. `data` holds `entries` and `research_queue` counts.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /knowledge/research:
    post:
      summary: Queue a research task (administrators only)
      description: "Body `{kind: biomarker|literature, term}`. The AI service queries only allowlisted public sources (LOINC, UCUM, MedlinePlus, PubMed); no patient data is sent."
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '202': { $ref: '#/components/responses/Success' }
  /knowledge/entries/bulk-approve:
    post:
      summary: Approve pending biomarker or unit proposals in bulk (administrators only)
      description: "Body `{kind: biomarker|unit, min_agreement, limit}`. Literature (`research_source`) must be approved individually."
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /knowledge/entries/{entryID}/approve:
    post:
      summary: Approve one pending proposal (administrators only)
      description: Biomarkers enter the catalog, units are added to the biomarker's learned units, and literature is embedded into the research index. Reviewed entries return 409 `ENTRY_NOT_PENDING`.
      parameters: [{ name: entryID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /knowledge/entries/{entryID}/reject:
    post:
      summary: Reject one pending proposal (administrators only)
      parameters: [{ name: entryID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /lifestyle-categories:
    get:
      summary: List lifestyle log categories with their unit and allowed range
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/symptoms:
    get:
      summary: List symptom journal entries (newest first)
      description: Filters `name`, `from`, `to` (YYYY-MM-DD) and `active=true|false`; paged with `limit` and `offset`.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid filter or pagination }
    post:
      summary: Log a symptom
      description: Requires health data storage consent. Body `{name, severity 1-10, started_at?, ended_at?, notes?}`. At most 5000 entries per profile.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid symptom }
        '403': { description: Consent required }
        '409': { description: Entry limit reached }
  /profiles/{profileID}/symptoms/summary:
    get:
      summary: Symptoms grouped by name over the last `days` (default 90) with count, average and maximum severity
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid window }
  /profiles/{profileID}/symptoms/{symptomID}:
    patch:
      summary: Update severity or notes, or mark a symptom resolved with `ended_at`
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: symptomID, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid change }
        '404': { description: Not found or not owned }
    delete:
      summary: Delete a symptom entry
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: symptomID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Deleted }
        '404': { description: Not found or not owned }
  /profiles/{profileID}/lifestyle-logs:
    get:
      summary: List lifestyle logs, optionally by `category`, `from` and `to`
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid filter or pagination }
    post:
      summary: Log sleep, exercise, nutrition, hydration, mood or stress for a day
      description: Requires health data storage consent. Body `{category, value, label?, notes?, logged_on?}`. The unit is fixed by the category and the value must be within its range. At most 20000 entries per profile.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      requestBody: { $ref: '#/components/requestBodies/JSON' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid entry }
        '403': { description: Consent required }
        '409': { description: Entry limit reached }
  /profiles/{profileID}/lifestyle-logs/{logID}:
    delete:
      summary: Delete a lifestyle log
      parameters: [{ $ref: '#/components/parameters/profileID' }, { name: logID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Deleted }
        '404': { description: Not found or not owned }
  /profiles/{profileID}/lifestyle/summary:
    get:
      summary: Per-category daily series, days logged and average per day over the last `days` (default 90)
      description: Sleep, exercise, nutrition and hydration are summed per day; mood and stress are averaged.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid window }
  /profiles/{profileID}/lifestyle/correlations:
    get:
      summary: Association between each lifestyle category and symptom severity
      description: Query `symptom` (optional name), `days` (1-365) and `lag` (0 same day, 1 next day). A category needs 7 days with varying values, otherwise its status is `insufficient_data`. Associations are not causes.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid parameter }
  /environment/now:
    get:
      summary: Live air quality and weather for an area from Open-Meteo, with the nearest OpenAQ station when configured
      description: Query `lat`, `lng` (rounded to a ~5 km grid on arrival, never stored). Returns current US AQI, PM2.5, PM10, ozone, NO2, UV, temperature, humidity and wind, an AQI category with general advice, and `station` readings if `CORTEX_OPENAQ_API_KEY` is set. Either upstream may be missing from the answer if it fails.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid area }
        '502': { description: Both sources unavailable }
  /environment/sources:
    get:
      summary: Data sources behind the environment screens and whether each is available
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /medications/search:
    get:
      summary: Match a typed medicine name to RxNorm medicines
      description: Query `q` (2-80 characters). Returns RxNorm identifiers, names and product type, a `did_you_mean` spelling suggestion when nothing matches, and a `coverage` note. The catalogue is US-based, not an Indian brand list. Nothing about the profile is sent upstream.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid query }
        '502': { description: Source unavailable }
  /medications/label:
    get:
      summary: FDA prescribing information for a medicine, quoted from the label
      description: Query `name`. Returns uses, boxed warning, warnings, interactions and side effects, each clipped to 1500 characters, with brand and generic names.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid query }
        '404': { description: No label found }
        '502': { description: Source unavailable }
  /nearby/places:
    get:
      summary: Doctors, clinics, pharmacies or labs near an area from OpenStreetMap, nearest first
      description: Query `kind` (doctor, clinic, pharmacy or lab), `lat`, `lng` (rounded to a ~5 km grid on arrival, never stored) and `radius_km` (1-50, default 10). Listings are community-mapped and flagged `verified:false`; they are not a registry or a recommendation.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid kind or area }
        '502': { description: Source unavailable }
  /nearby/sources:
    get:
      summary: Data sources behind the Nearby care screens, and which categories have none
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /nearby/alerts:
    get:
      summary: Outbreak alerts from WHO Disease Outbreak News, the caller's country first
      description: Query `country` (name). Cached for 10 minutes. 502 when the source is unreachable; nothing is invented.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '502': { description: Source unavailable }
  /nearby/hospitals:
    get:
      summary: Hospitals near an area from OpenStreetMap, nearest first
      description: Query `lat`, `lng` (rounded to a ~5 km grid on arrival, never stored) and `radius_km` (1-50, default 10).
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Invalid area }
        '502': { description: Source unavailable }
  /profiles/{profileID}/agent/permissions:
    get:
      summary: What the assistant may do for this profile
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/agent/permissions/{permission}:
    put:
      summary: Grant or withdraw one permission
      description: Permission is read_labs, read_devices, read_lifestyle or propose_actions. Body `granted`.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { description: Unknown permission }
  /profiles/{profileID}/agent/briefing:
    get:
      summary: Daily briefing restating the user's own records
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/agent/visit-prep:
    get:
      summary: Summary of the record to bring to an appointment
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/agent/plan:
    post:
      summary: Read the record and propose follow-ups for the user to approve
      description: Needs propose_actions and read_labs. Never re-proposes a result already proposed, approved or rejected.
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { description: Permission required }
  /profiles/{profileID}/agent/actions:
    get:
      summary: List proposed actions (query `status`)
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /profiles/{profileID}/agent/actions/{actionID}/approve:
    post:
      summary: Approve a proposal; this creates the follow-up
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { description: Not waiting for a decision }
  /profiles/{profileID}/agent/actions/{actionID}/reject:
    post:
      summary: Dismiss a proposal; nothing is created
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { description: Not waiting for a decision }
  /profiles/{profileID}/agent/activity:
    get:
      summary: What the assistant suggested and what the user decided
      parameters: [{ $ref: '#/components/parameters/profileID' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    profileID:
      name: profileID
      in: path
      required: true
      schema: { type: string, format: uuid }
    documentID:
      name: documentID
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    JSON:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
  responses:
    Success:
      description: Successful response envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Envelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          type: object
          properties:
            request_id: { type: string }
    SessionEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
      description: data contains access_token, token_type, and expires_at.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
