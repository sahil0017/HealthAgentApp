# Pull-request gate: every check that must pass before code reaches main.
# Every job always runs (no path filtering) and runs in parallel; the final `gate` job is green only if all of them pass.
# regression.yml calls this workflow with full=true to run everything unconditionally.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
        description: Ignore path filters, add the race detector and the real embedding model

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.full || false }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FULL: ${{ inputs.full || false }}

jobs:
  backend-static:
    name: go-static / fmt, tidy, vet, build, architecture
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go build ./...
      - name: Architecture rules (no cross-module imports, pure domain)
        run: go test -count=1 ./internal/archtest/...

  backend-test:
    name: go-test / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per module/service, each with its own Postgres, so they run in parallel and never share a database.
        include:
          - { name: api (cross-module integration), pkgs: ./internal/api/... }
          - { name: module identity, pkgs: ./internal/modules/identity/... }
          - { name: module vault, pkgs: ./internal/modules/vault/... }
          - { name: module biomarkers, pkgs: ./internal/modules/biomarkers/... }
          - { name: module healthai, pkgs: ./internal/modules/healthai/... }
          - { name: module research, pkgs: ./internal/modules/research/... }
          - { name: module governance, pkgs: ./internal/modules/governance/... }
          - { name: module commandcentre, pkgs: ./internal/modules/commandcentre/... }
          - { name: platform + domain + repo, pkgs: ./internal/platform/... ./internal/domain/... ./internal/repo/... ./internal/modules }
          - { name: worker + processing + knowledge, pkgs: ./internal/worker/... ./internal/processing/... ./internal/knowledge/... ./internal/labrange/... ./internal/objects/... ./internal/store/... ./cmd/... }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex-ci
          POSTGRES_DB: cortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cortex:cortex-ci@localhost:5432/cortex_test?sslmode=disable
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test
        run: |
          flags="-count=1 -p 1"
          if [ "$FULL" = "true" ]; then flags="$flags -race"; fi
          go test $flags ${{ matrix.pkgs }}

  ai-test:
    name: python-test / cortex-ai
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cortex-ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cortex-ai/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Install CPU torch so inference tests run in full regression
        if: inputs.full
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q

  web-test:
    name: web (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-build:
    name: docker-build / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: true
      matrix:
        service: [api, worker, cortex-ai]
    env:
      CORTEX_INFERENCE: ${{ inputs.full && '1' || '0' }}
      CORTEX_EMBEDDING_REQUIRED: ${{ inputs.full && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Generate local secrets
        run: |
          ./scripts/bootstrap-env
          sed -i "s/^CORTEX_INFERENCE=.*/CORTEX_INFERENCE=$CORTEX_INFERENCE/; s/^CORTEX_EMBEDDING_REQUIRED=.*/CORTEX_EMBEDDING_REQUIRED=$CORTEX_EMBEDDING_REQUIRED/" .env
      - name: Build image
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: ${{ matrix.service }}
          load: true
          set: |
            *.tags=healthagentapp-${{ matrix.service }}:latest
            *.cache-from=type=gha,scope=${{ matrix.service }}-${{ env.CORTEX_INFERENCE }}
            *.cache-to=type=gha,scope=${{ matrix.service }}-${{ env.CORTEX_INFERENCE }},mode=max
      - name: Worker image has OCR tools
        if: matrix.service == 'worker'
        run: |
          docker compose run --rm --no-deps --entrypoint tesseract worker --version
          docker compose run --rm --no-deps --entrypoint pdftoppm worker -v
      - name: Cancel the whole run on the first image build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
      - name: Free disk space
        if: always()
        run: |
          docker image prune -af
          docker builder prune -af
          docker system df

  docker-integration:
    name: docker-integration / full stack end to end
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Fast path: no model download in pull requests. The full regression runs the real BGE embedding image.
      CORTEX_INFERENCE: ${{ inputs.full && '1' || '0' }}
      CORTEX_EMBEDDING_REQUIRED: ${{ inputs.full && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Generate local secrets
        run: |
          ./scripts/bootstrap-env
          sed -i "s/^CORTEX_INFERENCE=.*/CORTEX_INFERENCE=$CORTEX_INFERENCE/; s/^CORTEX_EMBEDDING_REQUIRED=.*/CORTEX_EMBEDDING_REQUIRED=$CORTEX_EMBEDDING_REQUIRED/" .env
      - name: Build images in parallel (layer cache shared across runs)
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: api,worker,cortex-ai
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            worker.cache-from=type=gha,scope=worker
            worker.cache-to=type=gha,scope=worker,mode=max
            cortex-ai.cache-from=type=gha,scope=cortex-ai-${{ env.CORTEX_INFERENCE }}
            cortex-ai.cache-to=type=gha,scope=cortex-ai-${{ env.CORTEX_INFERENCE }},mode=max
      - name: Worker image has OCR tools
        run: |
          docker compose run --rm --no-deps --entrypoint tesseract worker --version
          docker compose run --rm --no-deps --entrypoint pdftoppm worker -v
      - name: Build all images (cache populated by docker-build)
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: api,worker,cortex-ai
          load: true
          set: |
            api.tags=healthagentapp-api:latest
            worker.tags=healthagentapp-worker:latest
            cortex-ai.tags=healthagentapp-cortex-ai:latest
            api.cache-from=type=gha,scope=api-${{ env.CORTEX_INFERENCE }}
            worker.cache-from=type=gha,scope=worker-${{ env.CORTEX_INFERENCE }}
            cortex-ai.cache-from=type=gha,scope=cortex-ai-${{ env.CORTEX_INFERENCE }}
      - name: Start the stack
        run: |
          if [ "$CORTEX_INFERENCE" != "1" ]; then export COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml; echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"; fi
          docker compose up -d --no-build --wait --wait-timeout 300
      - name: Smoke test (sign in, profile, consent, upload, worker extraction, export, delete)
        run: |
          set -a; . ./.env; set +a
          python3 scripts/ci-smoke.py http://localhost:8080
      - name: Show logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=200
      - name: Tear down containers, volumes and images
        if: always()
        run: |
          docker compose down -v --rmi all --remove-orphans
          docker system prune -af --volumes
          docker system df

  ios-build:
    name: swift-build / iOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned simulator app
        working-directory: ios
        run: |
          xcodebuild -project CortexApp.xcodeproj -target CortexApp \
            -sdk iphonesimulator -configuration Debug \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build

  # Single required check. Green only if every job above succeeded (skipped or cancelled counts as a failure).
  gate:
    if: always()
    needs: [backend-static, backend-test, ai-test, web-test, docker-build, docker-integration, ios-build]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize and require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          labels = {"backend-static": "Go static checks", "backend-test": "Go tests (all modules)", "ai-test": "Python tests", "web-test": "React web app",
                    "docker-build": "Docker images (api, worker, cortex-ai)", "docker-integration": "Full-stack integration",
                    "ios-build": "Swift iOS build"}
          rows = ["| Check | Result |", "|---|---|"]
          bad = False
          for k, v in needs.items():
              ok = v["result"] == "success"
              bad |= not ok
              rows.append(f"| {labels.get(k, k)} | {'✅' if ok else '❌ ' + v['result']} |")
          out = "\n".join(rows)
          print(out)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(out + "\n")
          sys.exit(1 if bad else 0)
          PY
