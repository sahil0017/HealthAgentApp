# The single pipeline. Static, unit, package, e2e and iOS jobs all start at once and run in parallel;
# only real dependencies are chained (e2e reuses the images built once by docker-build, deploy waits for the gate).
# A new push cancels the superseded run, and the `gate` job is the one required check.
# Every pull request must pass the `gate` job before merging:
#   static checks, Go tests per module, Python tests, web unit tests, Docker image builds, a full-stack smoke test,
#   the end-to-end suite with enforced 90% coverage plus the browser UI suite (desktop and phone sizes), and the iOS build.
# Every job always runs (no path filtering) and runs in parallel.
# Nightly (and on demand with full=true) it also runs the race detector, the real embedding model and a flaky-test check.
# On main it publishes the iOS simulator build to Appetize.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: false
        description: Add the race detector and the real embedding model
      go_min:
        description: Minimum Go e2e coverage (percent)
        default: "90"
      py_min:
        description: Minimum Python e2e coverage (percent)
        default: "90"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' }}-${{ inputs.full || false }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FULL: ${{ (inputs.full || github.event_name == 'schedule') }}

jobs:
  backend-static:
    name: static · go-static / fmt, tidy, vet, build, architecture
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go build ./...
      - name: Architecture rules (no cross-module imports, pure domain)
        run: go test -count=1 ./internal/archtest/...

  backend-test:
    name: unit · go-test / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per module/service, each with its own Postgres, so they run in parallel and never share a database.
        include:
          - { name: api (cross-module integration), pkgs: ./internal/api/... }
          - { name: module identity, pkgs: ./internal/modules/identity/... }
          - { name: module vault, pkgs: ./internal/modules/vault/... }
          - { name: module biomarkers, pkgs: ./internal/modules/biomarkers/... }
          - { name: module healthai, pkgs: ./internal/modules/healthai/... }
          - { name: module research, pkgs: ./internal/modules/research/... }
          - { name: module governance, pkgs: ./internal/modules/governance/... }
          - { name: module commandcentre, pkgs: ./internal/modules/commandcentre/... }
          - { name: platform + domain + repo, pkgs: ./internal/platform/... ./internal/domain/... ./internal/repo/... ./internal/modules }
          - { name: worker + processing + knowledge, pkgs: ./internal/worker/... ./internal/processing/... ./internal/knowledge/... ./internal/labrange/... ./internal/objects/... ./internal/store/... ./cmd/... }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex-ci
          POSTGRES_DB: cortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cortex:cortex-ci@localhost:5432/cortex_test?sslmode=disable
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test
        run: |
          flags="-count=1 -p 1"
          if [ "$FULL" = "true" ]; then flags="$flags -race"; fi
          go test $flags ${{ matrix.pkgs }}

  ai-test:
    name: unit · python-test / cortex-ai
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cortex-ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cortex-ai/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Install CPU torch so inference tests run in full regression
        if: ${{ (inputs.full || github.event_name == 'schedule') }}
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q

  web-test:
    name: unit · web (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Each image is built once here (instrumented for coverage, which is harmless at runtime) and handed to the e2e job as an
  # artifact, so nothing downstream rebuilds it. A failed build cancels the run immediately.
  docker-build:
    name: package · docker-build / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: true
      matrix:
        service: [api, worker, cortex-ai]
    env:
      CORTEX_INFERENCE: ${{ (inputs.full || github.event_name == 'schedule') && '1' || '0' }}
      CORTEX_EMBEDDING_REQUIRED: ${{ (inputs.full || github.event_name == 'schedule') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Generate local secrets
        run: |
          ./scripts/bootstrap-env
          sed -i "s/^CORTEX_INFERENCE=.*/CORTEX_INFERENCE=$CORTEX_INFERENCE/; s/^CORTEX_EMBEDDING_REQUIRED=.*/CORTEX_EMBEDDING_REQUIRED=$CORTEX_EMBEDDING_REQUIRED/" .env
      - name: Build image
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            docker-compose.yml
            docker-compose.coverage.yml
          targets: ${{ matrix.service }}
          load: true
          set: |
            *.tags=healthagentapp-${{ matrix.service }}:latest
            *.cache-from=type=gha,scope=${{ matrix.service }}-${{ env.CORTEX_INFERENCE }}
            *.cache-to=type=gha,scope=${{ matrix.service }}-${{ env.CORTEX_INFERENCE }},mode=max
      - name: Worker image has OCR tools
        if: matrix.service == 'worker'
        run: |
          docker run --rm --entrypoint tesseract healthagentapp-worker:latest --version
          docker run --rm --entrypoint pdftoppm healthagentapp-worker:latest -v
      - name: Save the image for the e2e job
        run: docker save healthagentapp-${{ matrix.service }}:latest | gzip -1 > image-${{ matrix.service }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: image-${{ matrix.service }}.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Cancel the whole run on the first image build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  ios-build:
    name: integrate · swift-build / iOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned simulator app
        working-directory: ios
        run: |
          xcodebuild -project CortexApp.xcodeproj -target CortexApp \
            -sdk iphonesimulator -configuration Debug \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build

  e2e:
    name: integrate · e2e / full stack, browser UI and coverage
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.idp.yml -f docker-compose.coverage.yml ${{ (inputs.full || github.event_name == 'schedule') && '' || '-f docker-compose.ci.yml' }}
      CORTEX_INFERENCE: ${{ (inputs.full || github.event_name == 'schedule') && '1' || '0' }}
      CORTEX_EMBEDDING_REQUIRED: ${{ (inputs.full || github.event_name == 'schedule') && 'true' || 'false' }}
      GO_MIN: ${{ inputs.go_min || '90' }}
      PY_MIN: ${{ inputs.py_min || '90' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate local secrets
        run: |
          scripts/bootstrap-env
          sed -i "s/^CORTEX_INFERENCE=.*/CORTEX_INFERENCE=$CORTEX_INFERENCE/; s/^CORTEX_EMBEDDING_REQUIRED=.*/CORTEX_EMBEDDING_REQUIRED=$CORTEX_EMBEDDING_REQUIRED/" .env
          pip install cryptography==43.0.3
          python3 scripts/testidp.py init
          mkdir -p .cover/go .cover/py
          chmod -R 777 .cover

      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: images
          merge-multiple: true

      - name: Load the images built by docker-build
        run: |
          for f in images/*.tar.gz; do gunzip -c "$f" | docker load; done
          rm -rf images

      - name: Start the stack
        run: |
          $COMPOSE up -d --no-build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/readyz >/dev/null 2>&1 && curl -fsS http://localhost:8000/healthz >/dev/null 2>&1 && exit 0
            sleep 3
          done
          echo "stack did not become ready" >&2
          $COMPOSE ps -a
          exit 1

      - name: Smoke test (fail fast before the long suites)
        run: python3 scripts/ci-smoke.py http://localhost:8080

      - name: Run the end-to-end suite
        run: |
          pip install -r e2e/requirements.txt
          set -a; . ./.env; set +a
          cd e2e && python -m pytest -v --junitxml=../.cover/e2e-junit.xml

      - name: Run the web UI suite in a browser (desktop and phone sizes)
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npx playwright test

      - name: Stop containers so coverage is flushed
        if: always()
        run: $COMPOSE stop -t 40 api worker cortex-ai

      - name: Coverage report and thresholds
        run: scripts/e2e-coverage-report

      - name: Show logs on failure
        if: failure()
        run: $COMPOSE ps -a && $COMPOSE logs --no-color --tail=150

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            .cover/out
            .cover/e2e-junit.xml
            web/test-results
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: $COMPOSE down -v --rmi local

  flaky-check:
    name: unit · repeat suite to expose flaky tests
    if: ${{ (inputs.full || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex-ci
          POSTGRES_DB: cortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cortex:cortex-ci@localhost:5432/cortex_test?sslmode=disable
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Repeat the suite to expose order-dependent and flaky tests
        run: go test -count=5 -p 1 -shuffle=on ./...

  # Single required check. Green only if every job above succeeded (skipped or cancelled counts as a failure).
  gate:
    name: gate · required check
    if: always()
    needs: [backend-static, backend-test, ai-test, web-test, docker-build, e2e, ios-build]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize and require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          labels = {"backend-static": "Go static checks", "backend-test": "Go tests (all modules)", "ai-test": "Python tests", "web-test": "React web app",
                    "docker-build": "Docker images (api, worker, cortex-ai)",
                    "e2e": "End-to-end suite, browser UI and 90% coverage",
                    "ios-build": "Swift iOS build"}
          rows = ["| Check | Result |", "|---|---|"]
          bad = False
          for k, v in needs.items():
              ok = v["result"] == "success"
              bad |= not ok
              rows.append(f"| {labels.get(k, k)} | {'✅' if ok else '❌ ' + v['result']} |")
          out = "\n".join(rows)
          print(out)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(out + "\n")
          sys.exit(1 if bad else 0)
          PY

  ios-publish:
    name: deploy · publish iOS simulator build to Appetize
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned simulator app
        working-directory: ios
        run: |
          xcodebuild -project CortexApp.xcodeproj -target CortexApp \
            -sdk iphonesimulator -configuration Debug \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build
          cd build/Debug-iphonesimulator && zip -qr ../../CortexApp-simulator.zip CortexApp.app

      - uses: actions/upload-artifact@v4
        with:
          name: CortexApp-simulator
          path: ios/CortexApp-simulator.zip

      - name: Upload to Appetize
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ vars.APPETIZE_PUBLIC_KEY }}
        run: |
          if [ -z "$APPETIZE_TOKEN" ]; then echo "APPETIZE_TOKEN not set; skipping"; exit 0; fi
          url="https://api.appetize.io/v1/apps"
          [ -n "$APPETIZE_PUBLIC_KEY" ] && url="$url/$APPETIZE_PUBLIC_KEY"
          curl -sS --fail -u "$APPETIZE_TOKEN:" -F "file=@ios/CortexApp-simulator.zip" \
            -F "platform=ios" "$url" | tee appetize.json
          echo
          echo "Set repo variable APPETIZE_PUBLIC_KEY to the publicKey above to reuse the same link."
