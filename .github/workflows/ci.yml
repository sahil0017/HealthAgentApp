# The single pipeline, laid out as Jenkins-style stages. Each stage starts only when the previous one is green;
# jobs inside a stage run in parallel:
#   1 Static analysis -> 2 Unit tests -> 3 Package (Docker images, APK) -> 4 Integration (e2e + coverage)
#   -> 5 Quality gate -> 6 Release (GitHub release + APK) -> 7 Publish (wiki).
# Railway's GitHub integration deploys main after this workflow succeeds, using Wait for CI.
# e2e reuses the images built once in stage 3.
# Pull request runs cancel superseded runs, and the `gate` job is the one required check.
# Every pull request must pass the `gate` job before merging:
#   static checks, Go tests per module, Python tests, Flutter analyze and tests, Docker image builds, a full-stack smoke test,
#   and the end-to-end suite with enforced coverage.
# Jobs are not path-filtered.
# Nightly (and on demand with full=true) it also runs the race detector, the real embedding model and a flaky-test check.
# On main it also publishes wiki/ to the GitHub wiki.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: false
        description: Add the race detector and the real embedding model
      go_min:
        description: Minimum Go e2e coverage (percent)
        default: "45"
      py_min:
        description: Minimum Python e2e coverage (percent)
        default: "45"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' }}-${{ inputs.full || false }}
  # Let a production deployment finish before a newer run can deploy over it.
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  FULL: ${{ (inputs.full || github.event_name == 'schedule') }}

jobs:
  backend-static:
    name: 1 · Static analysis / Go fmt, tidy, vet, build, architecture
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go build ./...
      - name: Architecture rules (no cross-module imports, pure domain)
        run: go test -count=1 ./internal/archtest/...

  backend-test:
    name: 2 · Unit tests / Go ${{ matrix.name }}
    needs: [backend-static]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per module/service, each with its own Postgres, so they run in parallel and never share a database.
        include:
          - { name: api (cross-module integration), pkgs: ./internal/api/... }
          - { name: module identity, pkgs: ./internal/modules/identity/... }
          - { name: module vault, pkgs: ./internal/modules/vault/... }
          - { name: module biomarkers, pkgs: ./internal/modules/biomarkers/... }
          - { name: module healthai, pkgs: ./internal/modules/healthai/... }
          - { name: module research, pkgs: ./internal/modules/research/... }
          - { name: module governance, pkgs: ./internal/modules/governance/... }
          - { name: module commandcentre, pkgs: ./internal/modules/commandcentre/... }
          - { name: platform + domain + repo, pkgs: ./internal/platform/... ./internal/domain/... ./internal/repo/... ./internal/modules }
          - { name: worker + processing + knowledge, pkgs: ./internal/worker/... ./internal/processing/... ./internal/knowledge/... ./internal/labrange/... ./internal/objects/... ./internal/store/... ./cmd/... }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex-ci
          POSTGRES_DB: cortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cortex:cortex-ci@localhost:5432/cortex_test?sslmode=disable
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test
        run: |
          flags="-count=1 -p 1"
          if [ "$FULL" = "true" ]; then flags="$flags -race"; fi
          go test $flags ${{ matrix.pkgs }}

  ai-test:
    name: 2 · Unit tests / Python cortex-ai
    needs: [backend-static]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cortex-ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cortex-ai/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Install CPU torch so inference tests run in full regression
        if: ${{ (inputs.full || github.event_name == 'schedule') }}
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q

  app-test:
    name: 2 · Unit tests / Flutter analyze and test
    needs: [backend-static]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  web-build:
    name: 3 · Package / production web image
    needs: [app-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the Railway web image
        run: docker build -f infra/railway/web/Dockerfile.github -t sehat-web:ci .

  # Installable Android build pointed at the Railway API; download it from the run's artifacts.
  app-apk:
    name: 3 · Package / Android APK
    needs: [backend-test, ai-test, app-test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
      name: ${{ steps.ver.outputs.name }}
      tag: ${{ steps.ver.outputs.tag }}
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The runner's NDK download is flaky, so fetch it up front and retry.
      - run: |
          for i in 1 2 3 4; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" && exit 0
            rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/.temp"; sleep 10
          done
          exit 1
        working-directory: .
      # Version name comes from pubspec.yaml; the build number is the workflow run number, so every build is unique and increasing.
      - name: Compute version
        id: ver
        working-directory: .
        run: |
          name="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)([+-].*)?$/\1/p' app/pubspec.yaml | head -1)"
          [ -n "$name" ] || { echo "::error::Cannot read version from app/pubspec.yaml"; exit 1; }
          echo "version=$name+${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Restore release keystore (optional)
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; the APK is signed with the debug key."
          fi
      - run: flutter build apk --release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ github.run_number }} --dart-define=SEHAT_API=https://web-production-baefd.up.railway.app
      - name: Name the APK and write a checksum
        working-directory: .
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/sehat-${{ steps.ver.outputs.tag }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: sehat-android-apk
          path: dist/
          if-no-files-found: error

  # Each image is built once here (instrumented for coverage, which is harmless at runtime) and handed to the e2e job as an
  # artifact, so nothing downstream rebuilds it. A failed build cancels the run immediately.
  docker-build:
    name: 3 · Package / Docker image ${{ matrix.service }}
    needs: [backend-test, ai-test, app-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: true
      matrix:
        service: [api, worker, cortex-ai]
    env:
      CORTEX_INFERENCE: ${{ (inputs.full || github.event_name == 'schedule') && '1' || '0' }}
      CORTEX_EMBEDDING_REQUIRED: ${{ (inputs.full || github.event_name == 'schedule') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Generate local secrets
        run: |
          ./scripts/bootstrap-env
          sed -i "s/^CORTEX_INFERENCE=.*/CORTEX_INFERENCE=$CORTEX_INFERENCE/; s/^CORTEX_EMBEDDING_REQUIRED=.*/CORTEX_EMBEDDING_REQUIRED=$CORTEX_EMBEDDING_REQUIRED/" .env
      - name: Build image
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            docker-compose.yml
            docker-compose.coverage.yml
          targets: ${{ matrix.service }}
          load: true
          set: |
            *.tags=healthagentapp-${{ matrix.service }}:latest
            *.cache-from=type=gha,scope=${{ matrix.service }}-${{ env.CORTEX_INFERENCE }}
            *.cache-to=type=gha,scope=${{ matrix.service }}-${{ env.CORTEX_INFERENCE }},mode=max
      - name: Worker image has OCR tools
        if: matrix.service == 'worker'
        run: |
          docker run --rm --entrypoint tesseract healthagentapp-worker:latest --version
          docker run --rm --entrypoint pdftoppm healthagentapp-worker:latest -v
      - name: Save the image for the e2e job
        run: docker save healthagentapp-${{ matrix.service }}:latest | gzip -1 > image-${{ matrix.service }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: image-${{ matrix.service }}.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Cancel the whole run on the first image build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  e2e:
    name: 4 · Integration / full stack e2e and coverage
    needs: [docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.idp.yml -f docker-compose.coverage.yml ${{ (inputs.full || github.event_name == 'schedule') && ' ' || '-f docker-compose.ci.yml' }}
      CORTEX_INFERENCE: ${{ (inputs.full || github.event_name == 'schedule') && '1' || '0' }}
      CORTEX_EMBEDDING_REQUIRED: ${{ (inputs.full || github.event_name == 'schedule') && 'true' || 'false' }}
      GO_MIN: ${{ inputs.go_min || '45' }}
      PY_MIN: ${{ inputs.py_min || '45' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate local secrets
        run: |
          scripts/bootstrap-env
          sed -i "s/^CORTEX_INFERENCE=.*/CORTEX_INFERENCE=$CORTEX_INFERENCE/; s/^CORTEX_EMBEDDING_REQUIRED=.*/CORTEX_EMBEDDING_REQUIRED=$CORTEX_EMBEDDING_REQUIRED/" .env
          pip install cryptography==43.0.3
          python3 scripts/testidp.py init
          mkdir -p .cover/go .cover/py
          chmod -R 777 .cover

      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: images
          merge-multiple: true

      - name: Load the images built by docker-build
        run: |
          for f in images/*.tar.gz; do gunzip -c "$f" | docker load; done
          rm -rf images

      - name: Start the stack
        run: |
          $COMPOSE up -d --no-build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/readyz >/dev/null 2>&1 && curl -fsS http://localhost:8000/healthz >/dev/null 2>&1 && exit 0
            sleep 3
          done
          echo "stack did not become ready" >&2
          $COMPOSE ps -a
          exit 1

      - name: Smoke test (fail fast before the long suites)
        run: python3 scripts/ci-smoke.py http://localhost:8080

      - name: Run the end-to-end suite
        run: |
          pip install -r e2e/requirements.txt
          set -a; . ./.env; set +a
          cd e2e && python -m pytest -v --junitxml=../.cover/e2e-junit.xml

      - name: Stop containers so coverage is flushed
        if: always()
        run: $COMPOSE stop -t 40 api worker cortex-ai

      - name: Coverage report and thresholds
        run: scripts/e2e-coverage-report

      - name: Show logs on failure
        if: failure()
        run: $COMPOSE ps -a && $COMPOSE logs --no-color --tail=150

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            .cover/out
            .cover/e2e-junit.xml
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: $COMPOSE down -v --rmi local

  flaky-check:
    name: 2 · Unit tests / repeat suite to expose flaky tests
    needs: [backend-static]
    if: ${{ (inputs.full || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex-ci
          POSTGRES_DB: cortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cortex:cortex-ci@localhost:5432/cortex_test?sslmode=disable
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Repeat the suite to expose order-dependent and flaky tests
        run: go test -count=5 -p 1 -shuffle=on ./...

  # Single required check. Green only if every job above succeeded (skipped or cancelled counts as a failure).
  gate:
    name: 5 · Quality gate / required check
    if: always()
    needs: [backend-static, backend-test, ai-test, app-test, web-build, docker-build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize and require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          stages = {"backend-static": ("1 Static analysis", "Go fmt, tidy, vet, build, architecture"),
                    "backend-test": ("2 Unit tests", "Go tests (all modules)"), "ai-test": ("2 Unit tests", "Python tests"),
                    "app-test": ("2 Unit tests", "Flutter analyze and tests"),
                    "web-build": ("3 Package", "Production web image"),
                    "docker-build": ("3 Package", "Docker images (api, worker, cortex-ai)"),
                    "e2e": ("4 Integration", "End-to-end suite and coverage")}
          rows = ["| Stage | Step | Result |", "|---|---|---|"]
          bad = False
          for k, v in sorted(needs.items(), key=lambda kv: stages.get(kv[0], ("9", ""))[0]):
              ok = v["result"] == "success"
              bad |= not ok
              stage, step = stages.get(k, ("-", k))
              rows.append(f"| {stage} | {step} | {'✅' if ok else '❌ ' + v['result']} |")
          out = "\n".join(rows)
          print(out)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(out + "\n")
          sys.exit(1 if bad else 0)
          PY

  # After the gate and APK build: every green build on main gets a lightweight tag
  # v<version>-build.<run>. A GitHub Release with the APK is created only for a major change, i.e. when the pubspec version
  # has no v<version> tag yet. Bump `version:` in app/pubspec.yaml to cut a release; ordinary features only get the build tag.
  release:
    name: 6 · Release / tag every build, GitHub release per version
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gate.result == 'success' && needs.app-apk.result == 'success' }}
    needs: [gate, app-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sehat-android-apk
          path: dist
      - name: Tag the build, and release when the version is new
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ needs.app-apk.outputs.tag }}
          VERSION: ${{ needs.app-apk.outputs.version }}
          RELEASE_TAG: v${{ needs.app-apk.outputs.name }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$BUILD_TAG" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$BUILD_TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          echo "- Tagged \`$BUILD_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "- Version $RELEASE_TAG already released; build tag only (APK is in the run artifacts)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          prev="$(gh release list --limit 1 --json tagName -q '.[0].tagName')"
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "Sehat ${RELEASE_TAG#v}" \
            --generate-notes ${prev:+--notes-start-tag "$prev"} --latest
          echo "- Released \`$RELEASE_TAG\` with the APK ($VERSION)" >> "$GITHUB_STEP_SUMMARY"

  wiki-sync:
    name: 7 · Publish / wiki to the GitHub wiki
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Push wiki/ to the wiki repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The wiki repo only exists after its first page is created once in the GitHub UI.
          if ! git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" /tmp/wiki 2>/dev/null; then
            echo "::warning::Wiki not initialised. Create the first page in the repository Wiki tab once, then re-run."
            exit 0
          fi
          rsync -a --delete --exclude .git wiki/ /tmp/wiki/
          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Wiki already up to date"; exit 0; }
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
