# Pull-request gate: every check that must pass before code reaches main.
# Jobs run in parallel; path filters skip the expensive ones (Docker, macOS) when their code did not change.
# regression.yml calls this workflow with full=true to run everything unconditionally.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
        description: Ignore path filters, add the race detector and the real embedding model

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.full || false }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FULL: ${{ inputs.full || false }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      ai: ${{ steps.f.outputs.ai }}
      ios: ${{ steps.f.outputs.ios }}
      stack: ${{ steps.f.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            ai:
              - 'cortex-ai/**'
              - '.github/workflows/ci.yml'
            ios:
              - 'ios/**'
              - '.github/workflows/ci.yml'
            stack:
              - 'backend/**'
              - 'cortex-ai/**'
              - 'docker-compose.yml'
              - 'infra/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  backend-static:
    needs: changes
    if: inputs.full || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go build ./...
      - name: Architecture rules (no cross-module imports, pure domain)
        run: go test -count=1 ./internal/archtest/...

  backend-test:
    needs: changes
    if: inputs.full || needs.changes.outputs.backend == 'true'
    name: backend-test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each shard has its own Postgres service, so shards never share a database and run in parallel.
        shard: [api, packages]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex-ci
          POSTGRES_DB: cortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cortex:cortex-ci@localhost:5432/cortex_test?sslmode=disable
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test
        run: |
          flags="-count=1 -p 1"
          if [ "$FULL" = "true" ]; then flags="$flags -race"; fi
          if [ "${{ matrix.shard }}" = "api" ]; then
            go test $flags ./internal/api/...
          else
            go test $flags $(go list ./... | grep -v '/internal/api')
          fi

  ai-test:
    needs: changes
    if: inputs.full || needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cortex-ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cortex-ai/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker-integration:
    needs: changes
    if: inputs.full || needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Fast path: no model download in pull requests. The full regression runs the real BGE embedding image.
      CORTEX_INFERENCE: ${{ inputs.full && '1' || '0' }}
      CORTEX_EMBEDDING_REQUIRED: ${{ inputs.full && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Generate local secrets
        run: |
          ./scripts/bootstrap-env
          sed -i "s/^CORTEX_INFERENCE=.*/CORTEX_INFERENCE=$CORTEX_INFERENCE/; s/^CORTEX_EMBEDDING_REQUIRED=.*/CORTEX_EMBEDDING_REQUIRED=$CORTEX_EMBEDDING_REQUIRED/" .env
      - name: Build images in parallel (layer cache shared across runs)
        uses: docker/bake-action@v6
        with:
          files: docker-compose.yml
          targets: api,worker,cortex-ai
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            worker.cache-from=type=gha,scope=worker
            worker.cache-to=type=gha,scope=worker,mode=max
            cortex-ai.cache-from=type=gha,scope=cortex-ai-${{ env.CORTEX_INFERENCE }}
            cortex-ai.cache-to=type=gha,scope=cortex-ai-${{ env.CORTEX_INFERENCE }},mode=max
      - name: Worker image has OCR tools
        run: |
          docker compose run --rm --no-deps --entrypoint tesseract worker --version
          docker compose run --rm --no-deps --entrypoint pdftoppm worker -v
      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 300
      - name: Smoke test (sign in, profile, consent, upload, worker extraction, export, delete)
        run: |
          set -a; . ./.env; set +a
          python3 scripts/ci-smoke.py http://localhost:8080
      - name: Show logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  ios-build:
    needs: changes
    if: inputs.full || needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned simulator app
        working-directory: ios
        run: |
          xcodebuild -project CortexApp.xcodeproj -target CortexApp \
            -sdk iphonesimulator -configuration Debug \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build

  # One stable name to require in branch protection. It passes when every job passed or was skipped by a path filter.
  gate:
    if: always()
    needs: [changes, backend-static, backend-test, ai-test, docker-integration, ios-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to pass or be skipped
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"'; then exit 1; fi
