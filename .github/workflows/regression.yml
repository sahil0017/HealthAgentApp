# Full regression: ignores path filters, runs Go tests with the race detector, builds the real
# embedding-model image, and repeats the backend tests to expose flaky ones. This is expensive, so it
# runs nightly, on demand, and on pull requests labelled "full-regression", never on every push.
name: regression

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-regression')
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  flaky-check:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-regression')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex-ci
          POSTGRES_DB: cortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cortex -d cortex_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cortex:cortex-ci@localhost:5432/cortex_test?sslmode=disable
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Repeat the suite to expose order-dependent and flaky tests
        run: go test -count=5 -p 1 -shuffle=on ./...
