name: Feature request
description: Propose a focused improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Do not include real health information, personal data, credentials, tokens, or private documents.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the use case without sharing sensitive or identifying details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain what you would like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches or trade-offs?
    validations:
      required: false
